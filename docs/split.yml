# .github/workflows/split.yml 로 저장
name: Split Levels
on:
  schedule:
    - cron: "40 21 * * 1-5"   # 미 증시 마감 후 06:40 KST (스캔과 10분 간격)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r scanner/requirements.txt yfinance
      - name: Run split engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OUT_PATH: docs/split.json
        run: PYTHONPATH=scanner python scanner/split_engine.py
      - name: Commit
        run: |
          git config user.name "scan-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/split.json
          git commit -m "chore: 스플릿 레벨 갱신 ($(date +%F))" || echo "no change"
          git push
