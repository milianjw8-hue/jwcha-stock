name: 국장 스캔

on:
  schedule:
    - cron: "10 7 * * 1-5"   # 평일 16:10 KST (07:10 UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scan-results
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scanner/requirements.txt

      - name: 의존성 설치
        run: pip install -r scanner/requirements.txt

      - name: 스캔 실행
        run: python scanner/scan_kr.py
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/results.json docs/ohlc
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          git commit -m "chore: 국장 스캔 결과 갱신 ($(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M KST'))"
          git pull --rebase origin main
          git push origin main
