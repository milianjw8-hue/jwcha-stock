name: Update weekly index data

on:
  schedule:
    - cron: "15 23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Fetch recent index closes
        run: python scripts/update_market_data.py
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weekly-data.json docs/weekly-data.json
          if git diff --cached --quiet; then
            echo "No market data changes"
          else
            git commit -m "Update weekly market index data"
            git push
          fi
